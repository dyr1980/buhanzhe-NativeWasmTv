name: Android Release
on:
  workflow_dispatch:
  push:
    branches: [ master ]
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 全程只使用JDK8，适配NativeWasmTv老项目
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      # 手动下载旧版cmdline‑tools(4.0)，兼容JDK8，不再使用setup‑android action
      - name: Manually install Android SDK cmdline‑tools 4.0
        run: |
          export ANDROID_SDK_ROOT=${{ github.workspace }}/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          rm cmdline.zip
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: 赋予gradlew执行权限
        run: chmod +x ./gradlew

      # 新增：从GitHub Secrets生成签名文件
      - name: 生成签名文件
        run: |
          mkdir -p .signing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > .signing/iptv-release.jks
          echo "alias=${{ secrets.KEY_ALIAS }}" > .signing/keystore-info.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> .signing/keystore-info.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> .signing/keystore-info.properties

      - name: 编译签名Release APK
        run: |
          ./gradlew assembleArm32Release assembleArm64Release --no-daemon

      # 修改：指定从 :app 模块中读取 printVersionName 任务
      - name: 读取Gradle版本号
        run: |
          APP_VERSION=$(./gradlew -q :app:printVersionName --no-daemon)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "read versionName: $APP_VERSION"

      - name: 复制APK到dist目录
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/arm32/release/XCZ.apk dist/
          cp app/build/outputs/apk/arm64/release/XCZ64.apk dist/
          ls -lh dist/

      - name: 生成version.json更新配置
        run: |
          ./gradlew generateVersionFile --no-daemon \
            -PupdateApk32=dist/XCZ.apk \
            -PupdateApk64=dist/XCZ64.apk \
            -PreleaseNotes="GitHub Actions在线自动构建"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 打包输出文件
          path: |
            dist/*.apk
            version.json
            version-iptv.json
          if-no-files-found: error
          retention-days: 30

      - name: 自动创建GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}-$(date +%Y%m%d%H%M)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "标签已存在，跳过Release创建"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "XCZTV ${TAG}" \
              --notes "GitHub Actions在线自动构建" \
              dist/*.apk version.json version-iptv.json
          fi
