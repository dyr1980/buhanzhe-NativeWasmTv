name: Android Release
on:
  workflow_dispatch:
  push:
    branches: [ master ]
permissions:
  contents: write
env:
  TZ: Asia/Shanghai
jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: gradle

      - name: Manually install Android SDK cmdline-tools 4.0
        run: |
          export ANDROID_SDK_ROOT=${{ github.workspace }}/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6858069_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          rm cmdline.zip
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 生成签名文件
        run: |
          mkdir -p .signing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > .signing/iptv-release.jks
          echo "alias=${{ secrets.KEY_ALIAS }}" > .signing/keystore-info.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> .signing/keystore-info.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> .signing/keystore-info.properties

      - name: 编译三种架构 Release APK
        run: |
          ./gradlew assembleArm32Release assembleArm64Release assembleX86Release --no-daemon

      - name: 读取版本号
        run: |
          APP_VERSION=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*versionName[[:space:]]*'([^']+)'.*/\1/")
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "read versionName: $APP_VERSION"

      - name: 复制 APK 到 dist 目录
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/arm32/release/XCZ.apk dist/XCZ.apk
          cp app/build/outputs/apk/arm64/release/XCZ64.apk dist/XCZ64.apk
          cp app/build/outputs/apk/x86/release/XCZX86.apk dist/XCZX86.apk
          ls -lh dist/

      - name: 生成更新清单
        run: |
          ./gradlew generateVersionFile --no-daemon \
            -PupdateApk32=dist/XCZ.apk \
            -PupdateApk64=dist/XCZ64.apk \
            -PupdateApkX86=dist/XCZX86.apk \
            -PimportantUpdate=true \
            -PreleaseNotes="小橙子电视 GitHub Actions 自动构建"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 打包输出文件
          path: |
            dist/*.apk
            version.json
            version-iptv.json
            version-lite.json
          if-no-files-found: error
          retention-days: 30

      - name: 自动创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}-$(date +%Y%m%d%H%M)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "标签已存在，跳过 Release 创建"
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "XCZTV ${TAG}" \
              --notes "小橙子电视 GitHub Actions 自动构建" \
              dist/XCZ.apk dist/XCZ64.apk dist/XCZX86.apk \
              version.json version-iptv.json version-lite.json
          fi
