rootProject.name = 'xcz'
include ':app'
// 私有 browser-core 未授权：仅在目录存在时才引入，避免阻塞公开部分构建。
def browserCore = file('browser-core')
if (new File(browserCore, 'litecore/build.gradle').isFile()) {
    include ':litebrowser', ':litecore'
    project(':litebrowser').projectDir = new File(browserCore, 'litebrowser')
    project(':litecore').projectDir = new File(browserCore, 'litecore')
}