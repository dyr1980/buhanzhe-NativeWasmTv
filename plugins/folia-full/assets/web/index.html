    <script>
      (function () {
        try {
          // 需要透明背景的入口不能盖遮罩：OBS 浏览器源会被直接推流捕获，
          // Electron 的透明播放背景 / 壁纸窗口（main.cjs 传 splash=0）会在桌面上闪一个黑块。
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.remove();
            }
            return;
          }
        } catch (error) {
          // 探测失败时保留遮罩，React 挂载后仍会移除它。
        }

        // 波形逐条随机化：高度、宽度、节奏、相位都带轻微抖动。
        // 同步执行，在首帧绘制前完成；失败时 CSS 里的默认值会兜底成一条静态波形。
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            return;
          }
          var rand = function (min, max) {
            return min + Math.random() * (max - min);
          };

          var bars = document.querySelectorAll('#app-splash .app-splash-wave span');
          for (var i = 0; i < bars.length; i += 1) {
            var bar = bars[i];
            var envelope = Math.sin(((i + 0.5) / bars.length) * Math.PI);
            var peak = Math.min(1, 0.32 + envelope * rand(0.38, 0.72));
            bar.style.setProperty('--peak', peak.toFixed(3));
            bar.style.setProperty('--floor', rand(0.08, 0.24).toFixed(3));
            bar.style.setProperty('--w', rand(3.5, 6.5).toFixed(2) + 'px');
            bar.style.setProperty('--alpha', rand(0.55, 1).toFixed(2));
            bar.style.setProperty('--glow', Math.round(rand(6, 26)) + 'px');
            bar.style.animationDuration = Math.round(rand(820, 1500)) + 'ms';
            bar.style.animationDelay = '-' + Math.round(rand(0, 1500)) + 'ms';
          }
        } catch (error) {
          // 随机化失败无所谓，CSS 默认值已经能跑一条波形。
        }
      })();
    </script>
    <script>
      (function () {
        var splash = document.getElementById('app-splash');
        if (!splash) return;
        var statusEl = document.getElementById('app-splash-status');
        if (!statusEl) return;
        var textEl = statusEl.querySelector('.app-splash-status-text');
        var retryBtn = statusEl.querySelector('.app-splash-retry');
        if (!textEl || !retryBtn) return;
        var isZh = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
        var copy = {
          waiting: isZh ? '仍在加载，网络似乎有点慢…' : 'Still loading — the network seems slow…',
          retryAdvice: isZh ? '加载较慢：可检查网络后稍候，或点击重试' : 'Loading slowly: check your network, keep waiting, or retry.',
          loadError: isZh ? '资源加载失败，请检查网络后重试' : 'Failed to load resources. Check your network and retry.',
          retry: isZh ? '重试' : 'Retry'
        };
        retryBtn.textContent = copy.retry;
        var alive = function () {
          return splash.isConnected && !splash.classList.contains('is-hiding');
        };
        var show = function (text, withRetry) {
          if (!alive()) return;
          textEl.textContent = text;
          if (withRetry) {
            retryBtn.hidden = false;
          }
          statusEl.classList.add('is-visible');
        };
        window.setTimeout(function () { show(copy.waiting, false); }, 6000);
        window.setTimeout(function () { show(copy.retryAdvice, true); }, 18000);
        window.addEventListener('error', function (event) {
          var tag = event.target && event.target.tagName;
          if (tag !== 'SCRIPT' && tag !== 'LINK') return;
          show(copy.loadError, true);
        }, true);
        retryBtn.addEventListener('click', function () {
          window.location.reload();
        });
      })();
    </script>
